<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniSeed OS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="instance.css"><link rel="stylesheet" href="work.css"></head>
<body>
  <aside>
    <a class="brand" href="#home"><span class="seed">◉</span> OmniSeed</a>
    <nav id="nav">
      <a class="active" href="#home" id="steward-nav">Steward</a><a href="#capabilities">Capabilities</a><a href="#realisations">Realisations</a><a href="#plan">Plan</a><a href="#observe">Observe</a><a href="#activity">Activity</a>
    </nav>
  </aside>
  <main>
    <header><div><strong id="company">Company</strong> <span class="live" id="runtime-label">Loading</span><small id="instance"></small></div><span id="summary"></span></header>
    <section id="home" class="view">
      <div class="lily-mark" id="steward-mark">S</div><p class="eyebrow" id="steward-title">DECLARED COMPANY STEWARD</p>
      <h1>What do you need to know<br>about this company?</h1>
      <form id="lily-form"><input id="intent" autocomplete="off" placeholder="Ask the declared steward…"><button title="Send">↑</button></form>
      <div class="suggestions"><button>What needs attention?</button><button>Generate a plan</button><button>What is missing?</button></div>
      <p id="lily-response" aria-live="polite"></p>
      <section id="lily-work" class="work hidden" aria-live="polite"><div class="section-title"><h2>Company work</h2><span id="work-status"></span></div><div id="work-timeline" class="timeline"></div></section>
      <div class="section-title"><h2>Needs attention</h2><span id="attention-count"></span></div><div id="attention" class="cards"></div>
    </section>
    <section id="projection" class="view hidden"><p class="eyebrow" id="projection-kind"></p><h1 id="projection-title"></h1><div id="projection-content" class="cards"></div></section>
  </main>
  <script type="module" src="app.js"></script>
</body></html>
