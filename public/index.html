<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniSeed OS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="instance.css"><link rel="stylesheet" href="work.css"><link rel="stylesheet" href="accessibility.css"></head>
<body>
  <aside>
    <a class="brand" href="#home"><span class="seed">◉</span> OmniSeed</a>
    <nav id="nav" aria-label="Company views">
      <a class="active" aria-current="page" href="#home" id="steward-nav">Steward</a><a href="#stewardship">Autonomy</a><a href="#capabilities">Capabilities</a><a href="#realisations">Realisations</a><a href="#plan">Plan</a><a href="#observe">Observe</a><a href="#activity">Activity</a>
    </nav>
  </aside>
  <main>
    <header><div><strong id="company">Company</strong> <span class="live" id="runtime-label">Loading</span><small id="instance"></small></div><span id="summary"></span></header>
    <section id="home" class="view">
      <div class="lily-mark" id="steward-mark">S</div><p class="eyebrow" id="steward-title">DECLARED COMPANY STEWARD</p>
      <h1>What do you need to know<br>about this company?</h1>
      <div class="conversation-toolbar"><label for="conversation-select">Conversation</label><select id="conversation-select" aria-label="Choose a durable conversation"></select><button id="new-conversation" type="button">New conversation</button></div>
      <form id="steward-form"><label class="visually-hidden" for="intent">Ask the declared company steward</label><input id="intent" autocomplete="off" placeholder="Ask the declared steward…"><button type="submit" aria-label="Send to the company steward">↑</button></form>
      <div class="suggestions"><button>What needs attention?</button><button>Generate a plan</button><button>What is missing?</button></div>
      <p id="steward-response" aria-live="polite"></p>
      <section id="steward-work" class="work hidden" aria-live="polite"><div class="section-title"><h2>Conversation</h2><span id="work-status"></span></div><div id="work-timeline" class="conversation" role="log" aria-label="Conversation and governed company work"></div><button id="cancel-work" type="button" class="secondary hidden">Cancel current work</button></section>
      <div class="section-title"><h2>Needs attention</h2><span id="attention-count"></span></div><div id="attention" class="cards"></div>
    </section>
    <section id="stewardship" class="view hidden">
      <p class="eyebrow">GOVERNED AUTONOMY</p><h1>Company stewardship</h1>
      <p id="stewardship-message" aria-live="polite">Sign in to inspect or change the current stewardship profile.</p>
      <div class="stewardship-controls"><label for="stewardship-expiry">Enable until</label><input id="stewardship-expiry" type="datetime-local" required><button id="enable-stewardship" type="button">Enable</button><button id="pause-stewardship" type="button" class="secondary">Pause</button><button id="disable-stewardship" type="button" class="secondary">Turn off</button></div>
      <div id="stewardship-content" class="cards"></div>
    </section>
    <section id="projection" class="view hidden"><p class="eyebrow" id="projection-kind"></p><h1 id="projection-title"></h1><div id="projection-content" class="cards"></div></section>
  </main>
  <script type="module" src="app.js"></script>
</body></html>
