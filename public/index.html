<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniSeed OS</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <aside>
    <a class="brand" href="#home"><span class="seed">◉</span> OmniSeed</a>
    <nav id="nav">
      <a class="active" href="#home">Lily</a><a href="#company-changes">Company changes</a><a href="#capabilities">Capabilities</a><a href="#agents">Agents</a><a href="#skills">Skills</a><a href="#connectors">Connectors</a><a href="#workflows">Workflows</a><a href="#schedules">Schedules</a><a href="#providers">Providers</a><a href="#activity">Activity</a>
    </nav>
  </aside>
  <main>
    <header><div><strong id="company">Company</strong> <span class="live">Live</span></div><span id="summary"></span></header>
    <section id="home" class="view">
      <div class="lily-mark">L</div><p class="eyebrow">LILY · COMPANY STEWARD</p>
      <h1>What do you want your company<br>to be able to do?</h1>
      <form id="lily-form"><input id="intent" autocomplete="off" placeholder="Ask Lily about the company…"><button title="Send">↑</button></form>
      <div class="suggestions"><button>What needs attention?</button><button>Generate a plan</button><button>What is missing?</button><button>Propose a company design change</button></div>
      <p id="lily-response" aria-live="polite"></p>
      <div class="section-title"><h2>Needs attention</h2><span id="attention-count"></span></div><div id="attention" class="cards"></div>
    </section>
    <section id="projection" class="view hidden"><p class="eyebrow" id="projection-kind"></p><h1 id="projection-title"></h1><div id="projection-content" class="cards"></div></section>
  </main>
  <script type="module" src="app.js"></script>
</body></html>
