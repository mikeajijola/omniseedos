name: CI
on: {pull_request: {}, push: {branches: [main]}}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: git clone --depth 1 https://github.com/mikeajijola/omniform.git ../omniform
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:fixtures
      - run: git clone --depth 1 https://github.com/mikeajijola/omniseed.git ../omniseed
      - run: npm install --prefix ../omniseed
      - run: npm run test:live
      - run: npm run build
      - run: test -s dist/index.html
      - run: node --test tests/e2e/static-deployment.test.mjs
