name: Operating experience proposal
description: Propose a capability interface or experience improvement
labels: ["type:proposal", "area:os"]
body:
  - type: textarea
    id: capability
    attributes: {label: Underlying capability and outcome}
    validations: {required: true}
  - type: textarea
    id: parity
    attributes: {label: Human, software/AI, and machine interface parity}
    validations: {required: true}
  - type: textarea
    id: runtime
    attributes: {label: OmniSeed contract consumed}
    validations: {required: true}
